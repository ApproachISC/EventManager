<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Sheet — Event Manager</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f0f4f8;
      color: #0c2340;
      padding: 2rem;
    }

    /* ── Loading overlay ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 100;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #c1cddd;
      border-top-color: #ae9142;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-msg { font-size: 0.95rem; color: #3d5a80; }

    /* ── Screen header ── */
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid #ae9142;
    }

    .sheet-header h1 { font-size: 1.3rem; font-weight: 700; color: #0c2340; }
    .sheet-header .meta { font-size: 0.78rem; color: #6b7a8d; margin-top: 3px; }

    .print-btn {
      background: #ae9142;
      color: #fff;
      border: none;
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .print-btn:hover { background: #9a7e38; }

    /* ── QR grid — screen ── */
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .qr-item {
      background: #fff;
      border: 1px solid #c1cddd;
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      break-inside: avoid;
      overflow: hidden;
    }

    .qr-wrap { flex-shrink: 0; line-height: 0; }

    .qr-wrap canvas,
    .qr-wrap img { display: block; }

    .qr-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 3px;
      height: stretch;
    }

    .qr-name {
      font-weight: 700;
      font-size: 0.82rem;
      color: #0c2340;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qr-code {
      font-size: 0.62rem;
      color: #6b7a8d;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Print — Avery 5160 (2⅝" × 1", 3 × 10 per sheet) ── */
    @media print {
      @page {
        size: letter;
        /* Avery 5160: 0.5in top/bottom, 0.1875in left/right */
        margin: 0.5in 0.1875in;
      }

      body {
        background: #fff;
        padding: 0;
        margin: 0;
      }

      .sheet-header { display: none !important; }

      .qr-grid {
        display: grid;
        /* 3 columns of exactly 2.625in with 0.125in gutters */
        grid-template-columns: repeat(3, 2.625in);
        column-gap: 0.125in;
        row-gap: 0;
        width: 100%;
      }

      .qr-item {
        width: 2.625in;
        height: 1in;
        border: none;
        border-radius: 0;
        padding: 0.06in 0.08in;
        gap: 0.07in;
        background: #fff;
        break-inside: avoid;
      }

      .qr-wrap canvas,
      .qr-wrap img {
        width: 0.72in !important;
        height: 0.72in !important;
      }

      .qr-name {
        font-size: 16pt;
        white-space: normal;
        line-height: 1.15;
      }

      .qr-code {
        font-size: 8pt;
        color: #555;
      }

      .qr-item-empty {
        border: none;
        background: transparent;
      }
    }

    /* ── Empty placeholder cell (screen) ── */
    .qr-item-empty {
      background: transparent;
      border: 1px dashed #fff;
    }
    .qr-item-empty .qr-wrap,
    .qr-item-empty .qr-info { display: none; }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <p id="loading-msg">Loading attendees…</p>
</div>

<div id="sheet" style="display:none">
  <div class="sheet-header">
    <div>
      <h1 id="event-title"></h1>
      <div class="meta" id="sheet-meta"></div>
      <div class="meta">On the print dialog, select "Actual Size" in the Scale(%) settings for best results.</div>
    </div>
    <button class="print-btn" onclick="window.print()">
      <i class="ti ti-printer"></i> Print
    </button>
  </div>
  <div id="qr-grid" class="qr-grid"></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/auth.js"></script>
<script>
async function init() {
  const eventId    = getParam("event_id");
  const attendeeId = getParam("attendee_id");
  const startPos   = Math.max(1, Math.min(30, parseInt(getParam("start_pos") ?? "1", 10)));

  if (!eventId) { showError("No event specified."); return; }

  const session = await requireAuth(["manager"]);
  if (!session) return;

  const { data: event, error: evErr } = await _supabase
    .from("events").select("name").eq("id", eventId).single();

  if (evErr || !event) { showError("Event not found."); return; }

  document.getElementById("event-title").textContent = event.name;
  document.title = `QR Sheet — ${event.name}`;

  const grid = document.getElementById("qr-grid");

  if (attendeeId) {
    // ── Single-label mode ────────────────────────────────────
    const { data: attendee, error: attErr } = await _supabase
      .from("event_attendees")
      .select("qr_token, profiles(name, email)")
      .eq("id", attendeeId)
      .eq("event_id", eventId)
      .single();

    if (attErr || !attendee) { showError("Attendee not found."); return; }

    document.getElementById("sheet-meta").textContent =
      `Single label · Position ${startPos} · Generated ${new Date().toLocaleDateString()}`;

    for (let i = 1; i < startPos; i++) {
      const empty = document.createElement("div");
      empty.className = "qr-item qr-item-empty";
      grid.appendChild(empty);
    }
    renderQrItem(grid, attendee);

  } else {
    // ── Full-sheet mode ──────────────────────────────────────
    const { data: attendees, error: attErr } = await _supabase
      .from("event_attendees")
      .select("qr_token, profiles(name, email)")
      .eq("event_id", eventId)
      .order("name", { referencedTable: "profiles", ascending: true });

    if (attErr || !attendees?.length) { showError("No attendees found for this event."); return; }

    document.getElementById("sheet-meta").textContent =
      `${attendees.length} attendee${attendees.length !== 1 ? "s" : ""} · Generated ${new Date().toLocaleDateString()}`;

    for (const a of attendees) renderQrItem(grid, a);
  }

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("sheet").style.display = "block";
}

function renderQrItem(grid, a) {
  const name  = a.profiles?.name  ?? a.profiles?.email ?? "Attendee";
  const token = a.qr_token || "NO_TOKEN";

  const item = document.createElement("div");
  item.className = "qr-item";

  const qrWrap = document.createElement("div");
  qrWrap.className = "qr-wrap";

  // 69px ≈ 0.72in at 96 CSS px/in — fits inside a 1in Avery 5160 label
  new QRCode(qrWrap, {
    text:         token,
    width:        69,
    height:       69,
    colorDark:    "#0c2340",
    colorLight:   "#ffffff",
    correctLevel: QRCode.CorrectLevel.M,
  });

  const info = document.createElement("div");
  info.className = "qr-info";

  const nameEl = document.createElement("div");
  nameEl.className   = "qr-name";
  nameEl.textContent = name;

  const codeEl = document.createElement("div");
  codeEl.className   = "qr-code";
  codeEl.textContent = token;

  info.appendChild(nameEl);
  info.appendChild(codeEl);
  item.appendChild(qrWrap);
  item.appendChild(info);
  grid.appendChild(item);
}

function showError(text) {
  const el = document.getElementById("loading-screen");
  if (!el) return;
  el.innerHTML = `<p style="color:#c0392b;font-size:1rem">${escHtml(text)}</p>
    <a href="javascript:window.close()" style="font-size:0.85rem;color:#3d5a80;margin-top:4px">Close this tab</a>`;
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
