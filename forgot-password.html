<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Event Manager</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-card-header">
      <div class="auth-logo" aria-hidden="true">
        <i class="ti ti-key"></i>
      </div>
      <h1>Forgot password?</h1>
      <p>We'll email you a link to reset it</p>
    </div>

    <div class="auth-card-body">

      <div id="error-alert" class="alert alert-danger mb-6" style="display:none" role="alert">
        <i class="ti ti-alert-circle"></i>
        <span id="error-msg">Something went wrong. Please try again.</span>
      </div>

      <div id="success-alert" class="alert alert-success mb-6" style="display:none" role="status">
        <i class="ti ti-circle-check"></i>
        <span>
          If an account exists for <strong id="sent-to"></strong>, you'll receive an email
          with a link to reset your password. Check your spam folder if you don't see it.
        </span>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">
            Email address <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="ti ti-mail input-icon"></i>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="form-error" id="email-error" style="display:none">
            <i class="ti ti-alert-circle"></i> Please enter a valid email address.
          </span>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-xl w-full mt-2">
          <i class="ti ti-send"></i>
          Send Reset Link
        </button>
      </form>

      <p class="text-center text-sm mt-6">
        <a href="index.html"><i class="ti ti-arrow-left"></i> Back to sign in</a>
      </p>

    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (() => {
      const form       = document.getElementById("forgot-form");
      const emailIn    = document.getElementById("email");
      const emailErr   = document.getElementById("email-error");
      const submitBtn  = document.getElementById("submit-btn");
      const errAlert   = document.getElementById("error-alert");
      const errMsg     = document.getElementById("error-msg");
      const okAlert    = document.getElementById("success-alert");

      // Pre-fill from login page (?email=...)
      const prefill = getParam("email");
      if (prefill) emailIn.value = prefill;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errAlert.style.display = "none";
        okAlert.style.display  = "none";

        const email = emailIn.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailErr.style.display = "flex";
          emailIn.classList.add("error");
          return;
        }

        setButtonLoading(submitBtn, true);
        try {
          await requestPasswordRecovery(email);
          document.getElementById("sent-to").textContent = email;
          okAlert.style.display = "flex";
          form.reset();
        } catch (err) {
          errMsg.textContent = "We couldn't send the reset email. Please try again later.";
          errAlert.style.display = "flex";
        } finally {
          setButtonLoading(submitBtn, false);
        }
      });

      emailIn.addEventListener("input", () => {
        emailIn.classList.remove("error");
        emailErr.style.display = "none";
        errAlert.style.display = "none";
      });
    })();
  </script>

</body>
</html>
