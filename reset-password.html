<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Event Manager</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-card-header">
      <div class="auth-logo" aria-hidden="true">
        <i class="ti ti-lock-open"></i>
      </div>
      <h1>Reset password</h1>
      <p>Choose a new password for your account</p>
    </div>

    <div class="auth-card-body">

      <!-- Shown while the link is being verified -->
      <div id="verifying" class="text-center text-sm text-muted">
        <span class="spinner spinner-sm"></span> Verifying your reset link…
      </div>

      <!-- Shown when the link is missing, expired or already used -->
      <div id="invalid-link" style="display:none">
        <div class="alert alert-danger mb-6" role="alert">
          <i class="ti ti-alert-circle"></i>
          <span>This reset link is invalid or has expired. Please request a new one.</span>
        </div>
        <a href="forgot-password.html" class="btn btn-primary btn-xl w-full">
          <i class="ti ti-send"></i>
          Request a New Link
        </a>
      </div>

      <div id="error-alert" class="alert alert-danger mb-6" style="display:none" role="alert">
        <i class="ti ti-alert-circle"></i>
        <span id="error-msg">Something went wrong. Please try again.</span>
      </div>

      <form id="reset-form" novalidate style="display:none">

        <div class="form-group">
          <label class="form-label" for="new-password">
            New password <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="ti ti-lock input-icon"></i>
            <input
              type="password"
              id="new-password"
              class="form-control"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
              minlength="8"
            />
            <button
              type="button"
              class="input-suffix"
              data-toggle="new-password"
              aria-label="Toggle password visibility"
              style="border:none;background:none;cursor:pointer;color:var(--dark-sky-blue);padding-right:0.5rem;"
            >
              <i class="ti ti-eye"></i>
            </button>
          </div>
          <span class="form-error" id="pw1-error" style="display:none">
            <i class="ti ti-alert-circle"></i> Password must be at least 8 characters.
          </span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">
            Confirm password <span class="required">*</span>
          </label>
          <div class="input-group">
            <i class="ti ti-lock-check input-icon"></i>
            <input
              type="password"
              id="confirm-password"
              class="form-control"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="input-suffix"
              data-toggle="confirm-password"
              aria-label="Toggle confirm password visibility"
              style="border:none;background:none;cursor:pointer;color:var(--dark-sky-blue);padding-right:0.5rem;"
            >
              <i class="ti ti-eye"></i>
            </button>
          </div>
          <span class="form-error" id="pw2-error" style="display:none">
            <i class="ti ti-alert-circle"></i> Passwords do not match.
          </span>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-gold btn-xl w-full mt-2">
          <i class="ti ti-check"></i>
          Save New Password
        </button>
      </form>

      <p class="text-center text-sm mt-6">
        <a href="index.html"><i class="ti ti-arrow-left"></i> Back to sign in</a>
      </p>

    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const verifyingEl = document.getElementById("verifying");
      const invalidEl   = document.getElementById("invalid-link");
      const form        = document.getElementById("reset-form");
      const pw1In       = document.getElementById("new-password");
      const pw2In       = document.getElementById("confirm-password");
      const pw1Err      = document.getElementById("pw1-error");
      const pw2Err      = document.getElementById("pw2-error");
      const submitBtn   = document.getElementById("submit-btn");
      const errAlert    = document.getElementById("error-alert");
      const errMsg      = document.getElementById("error-msg");

      // ── 1. Verify the token from the email link ──────────────
      const tokenHash = getParam("token_hash");
      const type      = getParam("type");

      // Remove the one-time token from the address bar / history.
      history.replaceState(null, "", window.location.pathname);

      if (!tokenHash || type !== "recovery") {
        verifyingEl.style.display = "none";
        invalidEl.style.display   = "block";
        return;
      }

      try {
        await verifyRecoveryToken(tokenHash);
      } catch (err) {
        console.error("verifyRecoveryToken error:", err);
        verifyingEl.style.display = "none";
        invalidEl.style.display   = "block";
        return;
      }

      verifyingEl.style.display = "none";
      form.style.display        = "block";
      pw1In.focus();

      // ── 2. Password visibility toggles ───────────────────────
      document.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const input  = document.getElementById(btn.dataset.toggle);
          const isText = input.type === "text";
          input.type = isText ? "password" : "text";
          btn.querySelector("i").className = isText ? "ti ti-eye" : "ti ti-eye-off";
        });
      });

      // ── 3. Submit new password ───────────────────────────────
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errAlert.style.display = "none";

        const pw1 = pw1In.value;
        const pw2 = pw2In.value;
        let valid = true;

        if (pw1.length < 8) {
          pw1Err.style.display = "flex"; pw1In.classList.add("error"); valid = false;
        } else {
          pw1Err.style.display = "none"; pw1In.classList.remove("error");
        }

        if (pw1 !== pw2) {
          pw2Err.style.display = "flex"; pw2In.classList.add("error"); valid = false;
        } else {
          pw2Err.style.display = "none"; pw2In.classList.remove("error");
        }

        if (!valid) return;

        setButtonLoading(submitBtn, true);
        try {
          await setNewPassword(pw1);
          window.location.href = `${PAGES.login}?reset=1`;
        } catch (err) {
          errMsg.textContent = err.message ?? "Could not update your password. Please try again.";
          errAlert.style.display = "flex";
          setButtonLoading(submitBtn, false);
        }
      });

      [pw1In, pw2In].forEach(el => el.addEventListener("input", () => {
        el.classList.remove("error");
        errAlert.style.display = "none";
      }));
    })();
  </script>

</body>
</html>
